name: Deploy to Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: ci
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.release.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Finalize
        env:
          A3BC25: ${{ secrets.A3BC25 }}
          BF07E6: ${{ secrets.BF07E6 }}
        run: |
          python3 -c "
          import os, sys, pathlib
          tag_a = os.environ.get('A3BC25', '')
          tag_b = os.environ.get('BF07E6', '')
          fpath = pathlib.Path('index.html')
          orig = fpath.read_text(encoding='utf-8')
          updated = orig
          if tag_a:
              updated = updated.replace('<!-- e23c129365b4dc5d3476 -->', tag_a)
          if tag_b:
              updated = updated.replace('<!-- 549f85974eda910c27d3d6a43751 -->', tag_b)
          if updated == orig and (tag_a or tag_b):
              sys.exit(1)
          if updated != orig:
              fpath.write_text(updated, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: release
        uses: actions/deploy-pages@v4
